version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    # build(deps) passes the release gate, build(deps-dev) does not.
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the lowest supported Node major (engines: >=24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8 accepts TypeScript below 6.1 as a peer, so a new
      # TypeScript major fails npm ci until typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
